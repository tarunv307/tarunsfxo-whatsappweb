    /* =========================================================
       MODAL SYSTEM
       ========================================================= */
    function openModal({ title, sub, body, actions, wide }) {
      modalRoot.innerHTML = `
    <div class="modal" style="${wide ? "max-width:720px" : ""}">
      <div class="modal-head">
        <div style="flex:1"><div class="title">${esc(title)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
        <button class="icon-btn" data-close>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${actions || `<button class="btn primary" data-close>Close</button>`}</div>
    </div>`;
      modalRoot.classList.add("open");
      modalRoot.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
      modalRoot.onclick = (e) => { if (e.target === modalRoot) closeModal(); };
    }
    function closeModal() { modalRoot.classList.remove("open"); modalRoot.innerHTML = ""; }

    /* Forward modal */
    function openForwardModal(msg) {
      const list = state.chats.map(c => `
    <div class="member-row" data-fwd="${c.id}">
      <div class="avatar" style="--c:${c.color}">${esc(initials(c.name))}</div>
      <div class="grow"><div class="n">${esc(c.name)}</div>
        <div class="s">${c.type === "group" ? "Group" : "Contact"}</div></div>
    </div>`).join("");
      openModal({ title: "Forward message", body: list, actions: `<button class="btn ghost" data-close>Cancel</button>` });
      modalRoot.querySelectorAll("[data-fwd]").forEach(el => {
        el.onclick = () => {
          const target = state.chats.find(c => c.id === Number(el.dataset.fwd));
          target.messages.push({
            id: uid(), text: msg.text, time: nowTime(), out: true, status: "sent",
            type: msg.type, media: msg.media, forwarded: true
          });
          closeModal();
          toast("msg", "Forwarded", "to " + target.name);
          renderChatList();
          if (target.id === state.activeId) renderMessages();
        };
      });
    }

    /* Group members manager */
    function openGroupMembers(chat) {
      const list = (chat.members || []).map(m => `
    <div class="member-row">
      <div class="avatar" style="--c:${"#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0")}">${esc(initials(m))}</div>
      <div class="grow"><div class="n">${esc(m)}</div><div class="s">${m === "You" ? "You" : ""}</div></div>
      ${m !== "You" ? `<button class="icon-btn sm" data-remove="${esc(m)}" style="color:var(--danger)">✕</button>` : ""}
    </div>`).join("");
      openModal({
        title: "Group members", sub: chat.name, body: list,
        actions: `<button class="btn ghost" data-close>Close</button>
             <button class="btn primary" id="addMemberBtn">Add member</button>` });
      $("addMemberBtn").onclick = () => {
        const n = prompt("Name of new member:"); if (!n) return;
        chat.members.push(n.trim());
        openGroupMembers(chat); renderHeader();
      };
      modalRoot.querySelectorAll("[data-remove]").forEach(b => {
        b.onclick = () => {
          chat.members = chat.members.filter(m => m !== b.dataset.remove);
          openGroupMembers(chat); renderHeader();
        };
      });
    }

    /* Create group */
    function openCreateGroup() {
      const contacts = state.chats.filter(c => c.type === "dm").map(c => `
    <div class="member-row" data-mem="${c.id}">
      <div class="avatar" style="--c:${c.color}">${esc(initials(c.name))}</div>
      <div class="grow"><div class="n">${esc(c.name)}</div>
        <div class="s">${esc(c.phone || "")}</div></div>
      <div class="cb"></div>
    </div>`).join("");
      openModal({
        title: "New group",
        body: `
      <label class="field"><span class="lbl">Group name</span>
        <input id="gName" placeholder="e.g. Weekend Plans"/></label>
      <label class="field"><span class="lbl">Description (optional)</span>
        <input id="gDesc" placeholder="What's this group about?"/></label>
      <div style="font-size:13px;color:var(--accent-dark);margin:14px 0 6px">Add participants</div>
      ${contacts}`,
        actions: `<button class="btn ghost" data-close>Cancel</button>
             <button class="btn primary" id="gCreate">Create</button>`
      });
      const sel = new Set();
      modalRoot.querySelectorAll("[data-mem]").forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.mem);
          if (sel.has(id)) { sel.delete(id); el.classList.remove("selected"); }
          else { sel.add(id); el.classList.add("selected"); }
        };
      });
      $("gCreate").onclick = () => {
        const name = $("gName").value.trim(); if (!name) return toast("err", "Group needs a name");
        const members = ["You", ...[...sel].map(id => state.chats.find(c => c.id === id).name)];
        const newChat = {
          id: uid(), name, color: "#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0"),
          about: members.length + " members", unread: 0, type: "group", members,
          description: $("gDesc").value.trim(), pinned: false, archived: false, muted: false,
          e2e: true, disappearing: false, messages: []
        };
        state.chats.unshift(newChat);
        closeModal(); openChat(newChat.id); renderChatList();
        toast("msg", "Group created", name);
      };
    }

    /* AI: Summarize chat */
    function openSummary() {
      const chat = getActive(); if (!chat) return;
      const summary = summarize(chat.messages);
      const sent = analyzeSentiment(chat.messages);
      openModal({
        title: "Chat summary", sub: `${chat.messages.length} messages · Last 24h`,
        body: `
      <div style="margin-bottom:16px">
        <span class="ai-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 14 9l6 1-4.5 4.5L17 21l-5-3-5 3 1.5-6.5L4 10l6-1z"/></svg>AI Summary</span>
      </div>
      <div style="white-space:pre-wrap;line-height:1.7;font-size:14.5px">${esc(summary)}</div>
      <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border)">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Overall sentiment: <b style="color:var(--text)">${sent.label}</b></div>
        <div class="sentiment-bar">
          <div class="pos" style="width:${sent.pp}%"></div>
          <div class="neu" style="width:${sent.neu}%"></div>
          <div class="neg" style="width:${sent.nn}%"></div>
        </div>
      </div>`,
        actions: `<button class="btn primary" data-close>Close</button>`
      });
    }

    /* Translate chat */
    function translateChat() {
      const chat = getActive(); if (!chat) return;
      const last = chat.messages.slice(-3).map(m => `${m.out ? "You" : (m.from || chat.name)}: ${fakeTranslate(m.text).text}`).join("\n");
      openModal({
        title: "Translate → Spanish", sub: "Last 3 messages",
        body: `<div style="white-space:pre-wrap;line-height:1.8;font-size:14.5px">${esc(last)}</div>`,
        actions: `<button class="btn primary" data-close>Close</button>`
      });
    }

    /* =========================================================
       OPEN CHAT / TABS / EVENTS
       ========================================================= */
    function openChat(id) {
      state.activeId = id;
      const chat = getActive(); if (chat) chat.unread = 0;
      state.chatQuery = ""; state.replyTo = null; state.editing = null; state.attachment = null;
      $("chatSearchBar").classList.add("hidden");
      $("attachPreview").classList.add("hidden");
      $("editPreview").classList.add("hidden");
      $("replyPreview").classList.add("hidden");
      appEl.classList.add("mobile-open");
      emojiBar.classList.remove("open");
      render();
      setTimeout(() => inputEl.focus(), 60);
    }

    /* Tab switching */
    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        state.tab = t.dataset.tab;
        const chatMode = state.tab === "chats";
        $("searchWrap").style.display = chatMode ? "" : "none";
        $("filterRow").style.display = chatMode ? "" : "none";
        if (!chatMode) appEl.classList.remove("mobile-open");
        render();
      };
    });

    /* Filter chips */
    document.querySelectorAll(".chip").forEach(c => {
      c.onclick = () => {
        document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        state.filter = c.dataset.filter;
        renderChatList();
      };
    });

    chatListEl.addEventListener("click", (e) => {
      const item = e.target.closest(".chat-item");
      if (item) openChat(Number(item.dataset.id));
    });

    $("searchInput").addEventListener("input", (e) => { state.query = e.target.value; renderChatList(); });

    /* Right-click on message → context menu */
    messagesEl.addEventListener("contextmenu", (e) => {
      const msgEl = e.target.closest(".msg"); if (!msgEl) return;
      e.preventDefault();
      showCtxMenu(e, Number(msgEl.dataset.mid));
    });

    /* Long-press on touch */
    let pressTimer;
    messagesEl.addEventListener("touchstart", (e) => {
      const msgEl = e.target.closest(".msg"); if (!msgEl) return;
      pressTimer = setTimeout(() => {
        const t = e.touches[0];
        showCtxMenu({ clientX: t.clientX, clientY: t.clientY }, Number(msgEl.dataset.mid));
        if (navigator.vibrate) navigator.vibrate(30);
      }, 500);
    });
    ["touchend", "touchmove", "touchcancel"].forEach(ev => messagesEl.addEventListener(ev, () => clearTimeout(pressTimer)));

    /* Click on reactions or poll options */
    messagesEl.addEventListener("click", (e) => {
      const react = e.target.closest(".reactions .r");
      if (react) {
        const m = findMsg(getActive(), Number(react.dataset.react));
        if (m && m.reactions && m.reactions[react.dataset.em]) {
          const arr = m.reactions[react.dataset.em];
          const i = arr.indexOf("You");
          if (i >= 0) arr.splice(i, 1); else arr.push("You");
          if (!arr.length) delete m.reactions[react.dataset.em];
          renderMessages(false);
        }
        return;
      }
      const opt = e.target.closest(".opt[data-poll]");
      if (opt) {
        const m = findMsg(getActive(), Number(opt.dataset.poll));
        const idx = Number(opt.dataset.opt);
        if (m && m.media && m.media.myVote !== idx) {
          m.media.options.forEach((o, i) => { if (i === idx) o.votes = (o.votes || 0) + 1; else if (o.votes > 0) o.votes--; });
          m.media.myVote = idx;
          renderMessages(false);
        }
        return;
      }
      const voice = e.target.closest("[data-voice]");
      if (voice) {
        voice.classList.toggle("playing");
        return;
      }
      const jump = e.target.closest("[data-jump]");
      if (jump) {
        const el = messagesEl.querySelector(`[data-mid="${jump.dataset.jump}"]`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.querySelector(".bubble").style.transition = "outline .2s";
          el.querySelector(".bubble").style.outline = "2px solid var(--accent)";
          setTimeout(() => el.querySelector(".bubble").style.outline = "", 1200);
        }
        return;
      }
    });

    /* Close context menu on outside click */
    document.addEventListener("click", (e) => { if (!ctxMenu.contains(e.target)) hideCtx(); });
    document.addEventListener("scroll", hideCtx, true);

    /* Composer events */
    inputEl.addEventListener("input", () => { updateSendState(); if (state.chatQuery) return; });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      if (e.key === "Escape") { hideReplyPreview(); hideEditPreview(); inputEl.value = ""; updateSendState(); }
    });
    sendBtn.addEventListener("click", () => sendMessage());

    /* Emoji bar */
    $("emojiBtn").addEventListener("click", () => {
      emojiBar.classList.toggle("open");
      if (emojiBar.classList.contains("open")) renderEmojiTab("emojis");
    });
    document.querySelectorAll(".emoji-tabs .et").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".emoji-tabs .et").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        renderEmojiTab(t.dataset.et);
      };
    });
    function renderEmojiTab(tab) {
      const grid = $("emojiGrid");
      grid.className = "emoji-grid " + tab;
      const arr = tab === "emojis" ? EMOJIS_LIST : tab === "stickers" ? STICKERS : GIFS;
      grid.innerHTML = arr.map(x => `<button>${x}</button>`).join("");
      grid.querySelectorAll("button").forEach(b => {
        b.onclick = () => {
          if (tab === "gifs") {
            // Insert as a simulated GIF message
            const chat = getActive(); if (!chat) return;
            chat.messages.push({
              id: uid(), time: nowTime(), out: true, status: "sent", type: "image",
              media: `data:image/svg+xml;utf8,${encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff9a9e"/><stop offset="1" stop-color="#a1c4fd"/>
              </linearGradient></defs>
              <rect width="100%" height="100%" fill="url(#g)"/>
              <text x="50%" y="52%" font-size="34" font-family="Arial" fill="#fff"
                text-anchor="middle" font-weight="700">${esc(b.textContent)}</text>
              <animate attributeName="opacity" values="1;.7;1" dur="1.5s" repeatCount="indefinite"/>
            </svg>`)}`,
              text: ""
            });
            renderMessages(); renderChatList();
            emojiBar.classList.remove("open");
            simulateReply(chat.id, "sent a GIF");
          } else {
            inputEl.value += b.textContent;
            updateSendState();
            inputEl.focus();
          }
        };
      });
    }

    /* Attach popover */
    $("attachBtn").addEventListener("click", (e) => { e.stopPropagation(); $("attachPopover").classList.toggle("open"); });
    document.addEventListener("click", () => { $("attachPopover").classList.remove("open"); });
    $("attachPopover").addEventListener("click", (e) => e.stopPropagation());
    document.querySelectorAll("[data-attach]").forEach(b => {
      b.onclick = () => {
        const k = b.dataset.attach;
        $("attachPopover").classList.remove("open");
        if (k === "photo") $("filePhoto").click();
        else if (k === "document") $("fileDoc").click();
        else if (k === "camera") $("fileCam").click();
        else if (k === "contact") {
          const n = prompt("Contact name:", "Rahul Sharma"); if (!n) return;
          const p = prompt("Phone:", "+91 98765 00000") || "+91 98765 00000";
          setAttachment({ type: "contact", name: n, phone: p });
        }
        else if (k === "location") {
          setAttachment({ type: "location", label: "Current location" });
        }
        else if (k === "poll") openPollModal();
      };
    });

    /* Mic → voice message */
    $("micBtn").addEventListener("click", () => {
      if (state.recordingVoice) {
        // stop
        state.recordingVoice = false;
        $("micBtn").classList.remove("active");
        const dur = state.recordStart ? Math.max(1, Math.round((Date.now() - state.recordStart) / 1000)) : 3;
        setAttachment({ type: "voice", duration: dur + "s" });
        toast("msg", "Voice message ready", dur + "s · tap send");
        return;
      }
      state.recordingVoice = true;
      state.recordStart = Date.now();
      $("micBtn").classList.add("active");
      toast("warn", "Recording…", "Tap mic again to stop", 2500);
      setTimeout(() => {
        if (state.recordingVoice) {
          state.recordingVoice = false;
          $("micBtn").classList.remove("active");
          setAttachment({ type: "voice", duration: "3s" });
        }
      }, 3000);
    });

    /* Header actions */
    $("voiceCallBtn").onclick = () => { const c = getActive(); if (c) startCall(c.id, false); };
    $("videoCallBtn").onclick = () => { const c = getActive(); if (c) startCall(c.id, true); };
    $("infoBtn").onclick = () => openInfo();
    $("infoClose").onclick = () => infoPanel.classList.remove("open");
    $("backBtn").onclick = () => appEl.classList.remove("mobile-open");

    /* Chat search */
    $("chatSearchBtn").onclick = () => {
      const bar = $("chatSearchBar");
      bar.classList.toggle("hidden");
      if (!bar.classList.contains("hidden")) $("chatSearchInput").focus();
      else { state.chatQuery = ""; renderMessages(); }
    };
    $("chatSearchClose").onclick = () => { $("chatSearchBar").classList.add("hidden"); state.chatQuery = ""; renderMessages(); };
    $("chatSearchInput").addEventListener("input", (e) => { state.chatQuery = e.target.value.trim(); renderMessages(false); });

    /* header menu → AI actions */
    $("headerWho").onclick = () => openInfo();

    /* Sidebar buttons */
    $("newChatBtn").onclick = () => {
      const opts = `<div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn primary" id="newGroupBtn" style="justify-content:center">New group</button>
    <button class="btn ghost" id="newStatusBtn">Create status</button>
    <button class="btn ghost" id="summarizeBtn">AI: Summarize current chat</button>
    <button class="btn ghost" id="translateChatBtn">AI: Translate last messages</button>
  </div>`;
      openModal({ title: "Start something new", body: opts, actions: `<button class="btn ghost" data-close>Close</button>` });
      $("newGroupBtn").onclick = () => { closeModal(); openCreateGroup(); };
      $("newStatusBtn").onclick = () => { closeModal(); openStatusComposer(); };
      $("summarizeBtn").onclick = () => { closeModal(); openSummary(); };
      $("translateChatBtn").onclick = () => { closeModal(); translateChat(); };
    };

    $("menuBtn").onclick = () => {
      openModal({
        title: "Settings", body: `
    <div class="panel-action" data-set="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="grow">Profile</span><span style="color:var(--muted);font-size:13px">${esc(ME.name)}</span></div>
    <div class="panel-action" data-set="theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="grow">Theme</span><span style="color:var(--muted);font-size:13px">${document.body.classList.contains("dark") ? "Dark" : "Light"}</span></div>
    <div class="panel-action" data-set="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span class="grow">Privacy & Security</span></div>
    <div class="panel-action" data-set="linked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>
      <span class="grow">Linked devices</span></div>
    <div class="panel-action" data-set="backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span class="grow">Backup chats</span></div>
    <div class="panel-action" data-set="stars">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.6 6.6L21 10l-5 4.5L17.5 21 12 17.5 6.5 21 8 14.5 3 10l6.4-.4z"/></svg>
      <span class="grow">Starred messages</span></div>
    <div class="panel-action" data-set="ai" style="color:var(--accent-dark)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 14 9l6 1-4.5 4.5L17 21l-5-3-5 3 1.5-6.5L4 10l6-1z"/></svg>
      <span class="grow">AI Features</span><span style="color:var(--muted);font-size:12px">Active</span></div>
  `, actions: `<button class="btn ghost" data-close>Close</button>`
      });

      modalRoot.querySelectorAll("[data-set]").forEach(el => {
        el.onclick = () => {
          const k = el.dataset.set; closeModal();
          if (k === "theme") { document.body.classList.toggle("dark"); return; }
          if (k === "profile") {
            openModal({
              title: "Profile", body: `
          <label class="field"><span class="lbl">Name</span><input id="pfName" value="${esc(ME.name)}"/></label>
          <label class="field"><span class="lbl">About</span><input id="pfAbout" value="${esc(ME.about)}"/></label>
          <label class="field"><span class="lbl">Phone</span><input id="pfPhone" value="${esc(ME.phone)}" disabled/></label>`,
              actions: `<button class="btn ghost" data-close>Cancel</button>
                   <button class="btn primary" id="pfSave">Save</button>` });
            $("pfSave").onclick = () => {
              ME.name = $("pfName").value.trim() || ME.name;
              ME.about = $("pfAbout").value.trim() || ME.about;
              $("myAvatar").textContent = initials(ME.name);
              closeModal(); toast("msg", "Profile updated");
            };
            return;
          }
          if (k === "privacy") {
            openModal({
              title: "Privacy & Security", body: `
          <div class="panel-action"><span class="grow">Read receipts</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Last seen</span><span style="color:var(--muted);font-size:13px">Contacts</span></div>
          <div class="panel-action"><span class="grow">Profile photo</span><span style="color:var(--muted);font-size:13px">Contacts</span></div>
          <div class="panel-action"><span class="grow">Two-step verification</span><div class="badge-toggle"></div></div>
          <div class="panel-action"><span class="grow">App lock (biometric)</span><div class="badge-toggle"></div></div>
          <div class="panel-action"><span class="grow">End-to-end encryption</span><span style="color:var(--accent);font-size:13px">On</span></div>
        `, actions: `<button class="btn primary" data-close>Close</button>`
            });
            return;
          }
          if (k === "linked") {
            openModal({
              title: "Linked devices", body: `
          <div class="panel-action"><span class="grow">This browser</span><span style="color:var(--accent);font-size:13px">Active</span></div>
          <div class="panel-action"><span class="grow">iPhone 15</span><span style="color:var(--muted);font-size:13px">2h ago</span></div>
          <div class="panel-action"><span class="grow">MacBook Pro</span><span style="color:var(--muted);font-size:13px">Yesterday</span></div>
        `, actions: `<button class="btn primary" data-close>Close</button>`
            });
            return;
          }
          if (k === "backup") {
            toast("msg", "Backup started", "This may take a few minutes");
            return;
          }
          if (k === "stars") {
            const chat = getActive();
            const starred = chat ? chat.messages.filter(m => m.starred) : [];
            openModal({
              title: "Starred messages", sub: chat ? chat.name : "", body:
                starred.length ? starred.map(m => `<div class="panel-action"><span class="grow">${esc(m.text || "[media]")}</span><span style="color:var(--muted);font-size:12px">${m.time}</span></div>`).join("")
                  : `<div style="padding:20px;text-align:center;color:var(--muted)">No starred messages in this chat.</div>`,
              actions: `<button class="btn primary" data-close>Close</button>`
            });
            return;
          }
          if (k === "ai") {
            openModal({
              title: "AI Features", body: `
          <div class="panel-action"><span class="grow">Smart replies</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Contextual auto-reply</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Chat summarization</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Translation (EN → ES)</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Sentiment analysis</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Spam detection</span><div class="badge-toggle on"></div></div>
          <div class="panel-action"><span class="grow">Voice-to-text</span><div class="badge-toggle"></div></div>
        `, actions: `<button class="btn primary" data-close>Close</button>`
            });
            return;
          }
        };
      });
    };

    $("themeBtn").onclick = () => document.body.classList.toggle("dark");
    $("myAvatar").onclick = () => { $("menuBtn").click(); };

    /* Call controls */
    $("ctrlEnd").onclick = endCall;
    $("ctrlMute").onclick = () => {
      if (!state.call) return; state.call.muted = !state.call.muted;
      $("ctrlMute").classList.toggle("off"); toast("warn", state.call.muted ? "Muted" : "Unmuted");
    };
    $("ctrlVideo").onclick = () => {
      if (!state.call) return; state.call.cam = !state.call.cam;
      $("ctrlVideo").classList.toggle("off"); toast("warn", state.call.cam ? "Camera on" : "Camera off");
    };
    $("ctrlSpeaker").onclick = () => {
      if (!state.call) return; state.call.speaker = !state.call.speaker;
      toast("warn", state.call.speaker ? "Speaker on" : "Speaker off");
    };

    /* Keyboard shortcuts */
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { hideCtx(); closeModal(); if (state.call) endCall(); }
    });

    /* =========================================================
       BOOT
       ========================================================= */
    render();
    if (window.innerWidth > 760 && state.chats.length) openChat(state.chats[0].id);

    /* welcome toast */
    setTimeout(() => toast("msg", "Welcome to WhatsApp Web Pro",
      "Right-click a message for reply, react, forward & AI tools."), 600);
  </script>
</body>

</html>
