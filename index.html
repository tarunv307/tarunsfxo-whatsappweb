<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tarunsfxo-WhatsApp</title>
  <style>
    :root {
      --accent: #00a884;
      --accent-dark: #008069;
      --panel: #fff;
      --panel-2: #f0f2f5;
      --input-bg: #fff;
      --border: #e9edef;
      --chat-bg: #efeae2;
      --bubble-in: #fff;
      --bubble-out: #d9fdd3;
      --text: #111b21;
      --muted: #667781;
      --hover: #f5f6f6;
      --active: #f0f2f5;
      --tick-read: #53bdeb;
      --app-bg: #d1d7db;
      --danger: #ea0038;
      --warn: #ffb02e;
    }

    body.dark {
      --panel: #111b21;
      --panel-2: #202c33;
      --input-bg: #2a3942;
      --border: #222d34;
      --chat-bg: #0b141a;
      --bubble-in: #202c33;
      --bubble-out: #005c4b;
      --text: #e9edef;
      --muted: #8696a0;
      --hover: #202c33;
      --active: #2a3942;
      --app-bg: #0b141a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--app-bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background .2s;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 127px;
      background: #00a884;
      z-index: 0
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1700px;
      height: 100%;
      display: flex;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 8px 34px rgba(11, 20, 26, .28);
    }

    @media(min-width:1200px) {
      .app {
        height: calc(100% - 38px)
      }
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 32%;
      min-width: 320px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      position: relative
    }

    .sidebar-header {
      height: 59px;
      flex-shrink: 0;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px
    }

    .sidebar-tabs {
      display: flex;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .tab {
      flex: 1;
      padding: 11px 8px;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none
    }

    .tab:hover {
      color: var(--text)
    }

    .tab.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent-dark);
      font-weight: 600
    }

    body.dark .tab.active {
      color: var(--accent)
    }

    .tab svg {
      width: 16px;
      height: 16px
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
      position: relative;
      flex-shrink: 0
    }

    .icon-btn:hover {
      background: rgba(134, 150, 160, .18);
      color: var(--text)
    }

    .icon-btn svg {
      width: 22px;
      height: 22px
    }

    .icon-btn.sm {
      width: 32px;
      height: 32px
    }

    .icon-btn.sm svg {
      width: 17px;
      height: 17px
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--c, #6a7175);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      user-select: none;
      letter-spacing: .3px;
      overflow: hidden
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .avatar.sm {
      width: 30px;
      height: 30px;
      font-size: 12px
    }

    .avatar.lg {
      width: 120px;
      height: 120px;
      font-size: 42px
    }

    .search-wrap {
      padding: 8px 12px;
      flex-shrink: 0;
      background: var(--panel)
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-2);
      border-radius: 8px;
      height: 38px;
      padding: 0 12px
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex-shrink: 0
    }

    .search input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit
    }

    .search input::placeholder {
      color: var(--muted)
    }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 0 12px 8px;
      flex-shrink: 0
    }

    .chip {
      padding: 5px 12px;
      border-radius: 14px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12.5px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: .15s
    }

    .chip:hover {
      background: var(--hover)
    }

    .chip.active {
      background: rgba(0, 168, 132, .15);
      color: var(--accent-dark);
      border-color: rgba(0, 168, 132, .4);
      font-weight: 600
    }

    body.dark .chip.active {
      color: var(--accent)
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden
    }

    .chat-item {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      position: relative
    }

    .chat-item:hover {
      background: var(--hover)
    }

    .chat-item.active {
      background: var(--active)
    }

    .chat-item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .chat-name {
      font-size: 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px
    }

    .chat-name svg {
      width: 14px;
      height: 14px;
      color: var(--muted);
      flex-shrink: 0
    }

    .chat-time {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0
    }

    .preview {
      font-size: 13.5px;
      color: var(--muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .preview .you {
      color: var(--muted)
    }

    .preview.typing {
      color: var(--accent-dark);
      font-style: italic
    }

    body.dark .preview.typing {
      color: var(--accent)
    }

    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      padding: 0 6px;
      flex-shrink: 0
    }

    .badge.muted {
      background: var(--muted)
    }

    .chat-list::-webkit-scrollbar,
    .messages::-webkit-scrollbar,
    .panel-scroll::-webkit-scrollbar {
      width: 6px
    }

    .chat-list::-webkit-scrollbar-thumb,
    .messages::-webkit-scrollbar-thumb,
    .panel-scroll::-webkit-scrollbar-thumb {
      background: rgba(134, 150, 160, .4);
      border-radius: 3px
    }

    /* ---------- STATUS & CALLS LISTS ---------- */
    .list-empty {
      padding: 50px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px
    }

    .status-item,
    .call-item {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 11px 16px;
      cursor: pointer;
      transition: background .12s
    }

    .status-item:hover,
    .call-item:hover {
      background: var(--hover)
    }

    .ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      padding: 2.5px;
      flex-shrink: 0;
      background: conic-gradient(var(--accent) 0 320deg, transparent 320deg);
    }

    .ring.viewed {
      background: var(--muted)
    }

    .ring .avatar {
      width: 100%;
      height: 100%;
      font-size: 15px;
      border: 2.5px solid var(--panel)
    }

    .item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .item-title {
      font-size: 15.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .item-sub {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .call-item .call-type {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .call-item .call-type svg {
      width: 14px;
      height: 14px;
      color: var(--muted)
    }

    .call-item .call-type.missed svg,
    .call-item .call-type.missed .item-sub {
      color: var(--danger)
    }

    /* ---------- CHAT ---------- */
    .chat {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
      background-image: radial-gradient(rgba(0, 0, 0, .045) 1px, transparent 1px);
      background-size: 24px 24px
    }

    body.dark .chat {
      background-image: radial-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px)
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 30px;
      background: var(--panel-2);
      border-bottom: 6px solid var(--accent)
    }

    body.dark .empty-state {
      background: #222e35
    }

    .empty-state svg {
      width: 200px;
      height: 200px;
      opacity: .9
    }

    .empty-state h1 {
      font-size: 32px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: -.5px
    }

    .empty-state p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 520px
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0
    }

    .hidden {
      display: none !important
    }

    .chat-header {
      height: 59px;
      flex-shrink: 0;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      z-index: 5;
      border-bottom: 1px solid var(--border);
      position: relative
    }

    .chat-header .who {
      flex: 1;
      min-width: 0;
      cursor: pointer
    }

    .chat-header .who .name {
      font-size: 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .chat-header .who .name svg {
      width: 15px;
      height: 15px;
      color: var(--muted)
    }

    .chat-header .who .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px
    }

    .chat-header .who .status.typing {
      color: var(--accent)
    }

    .back-btn {
      display: none
    }

    /* Messages */
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 6% 14px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth
    }

    .date-chip {
      align-self: center;
      margin: 8px 0 14px;
      background: var(--bubble-in);
      color: var(--muted);
      font-size: 12.5px;
      padding: 5px 12px;
      border-radius: 8px;
      box-shadow: 0 1px 1px rgba(11, 20, 26, .1);
      text-transform: uppercase;
      letter-spacing: .4px
    }

    .msg {
      display: flex;
      margin-bottom: 2px;
      animation: pop .16s ease-out;
      position: relative
    }

    .msg.group-start {
      margin-top: 9px
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .msg.out {
      justify-content: flex-end
    }

    .msg.selected .bubble {
      outline: 2px solid var(--accent)
    }

    .bubble {
      position: relative;
      max-width: 65%;
      background: var(--bubble-in);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 14.5px;
      line-height: 19.5px;
      box-shadow: 0 1px .5px rgba(11, 20, 26, .13);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      cursor: pointer;
      transition: outline .1s
    }

    .msg.out .bubble {
      background: var(--bubble-out)
    }

    .bubble.media {
      padding: 4px
    }

    .bubble img,
    .bubble video {
      max-width: 100%;
      border-radius: 6px;
      display: block;
      max-height: 280px;
      cursor: pointer
    }

    .bubble .caption {
      padding: 5px 5px 2px;
      font-size: 14.5px
    }

    .bubble .doc {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, .04);
      border-radius: 6px
    }

    body.dark .bubble .doc {
      background: rgba(255, 255, 255, .05)
    }

    .bubble .doc .doc-icon {
      width: 38px;
      height: 44px;
      background: var(--danger);
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0
    }

    .bubble .doc .doc-info {
      flex: 1;
      min-width: 0
    }

    .bubble .doc .doc-info .n {
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bubble .doc .doc-info .s {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .bubble .loc {
      width: 250px;
      height: 150px;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
      display: grid;
      place-items: center
    }

    body.dark .bubble .loc {
      background: linear-gradient(135deg, #1b3a2f, #0f2a22)
    }

    .bubble .loc svg {
      width: 36px;
      height: 36px;
      color: var(--danger);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4))
    }

    .bubble .loc .loc-txt {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      font-size: 12px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px
    }

    .bubble .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      background: rgba(0, 0, 0, .04);
      border-radius: 6px;
      min-width: 220px
    }

    body.dark .bubble .contact {
      background: rgba(255, 255, 255, .05)
    }

    .bubble .contact .info {
      flex: 1
    }

    .bubble .contact .info .n {
      font-size: 14px
    }

    .bubble .contact .info .p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .bubble .poll {
      padding: 8px 4px;
      min-width: 230px
    }

    .bubble .poll .q {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14.5px
    }

    .bubble .poll .opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
      border-bottom: 1px solid rgba(0, 0, 0, .08)
    }

    body.dark .bubble .poll .opt {
      border-bottom-color: rgba(255, 255, 255, .08)
    }

    .bubble .poll .opt:last-child {
      border: none
    }

    .bubble .poll .opt .bar {
      flex: 1;
      position: relative;
      height: 20px;
      background: rgba(0, 0, 0, .06);
      border-radius: 10px;
      overflow: hidden
    }

    body.dark .bubble .poll .opt .bar {
      background: rgba(255, 255, 255, .07)
    }

    .bubble .poll .opt .bar .fill {
      position: absolute;
      inset: 0;
      width: 0;
      background: rgba(0, 168, 132, .35);
      border-radius: 10px;
      transition: width .3s
    }

    .bubble .poll .opt .lbl {
      position: relative;
      font-size: 13px;
      padding: 0 8px;
      line-height: 20px;
      z-index: 1
    }

    .bubble .poll .opt .pct {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 32px;
      text-align: right
    }

    .bubble .poll .opt.voted .lbl {
      font-weight: 600
    }

    .bubble .poll .meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 8px
    }

    .bubble .voice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 2px;
      min-width: 220px
    }

    .bubble .voice .play {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer
    }

    .bubble .voice .play svg {
      width: 16px;
      height: 16px
    }

    .bubble .voice .wave {
      flex: 1;
      height: 26px;
      display: flex;
      align-items: center;
      gap: 2px
    }

    .bubble .voice .wave i {
      flex: 1;
      background: var(--muted);
      border-radius: 1px;
      display: block;
      opacity: .55;
      transition: opacity .2s
    }

    .bubble .voice.playing .wave i {
      opacity: 1;
      background: var(--accent-dark)
    }

    .bubble .voice .dur {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0
    }

    .bubble .reply-quote {
      background: rgba(0, 0, 0, .06);
      border-left: 3px solid var(--accent);
      padding: 5px 8px;
      border-radius: 4px;
      margin-bottom: 5px;
      font-size: 13px;
      cursor: pointer
    }

    body.dark .bubble .reply-quote {
      background: rgba(255, 255, 255, .05)
    }

    .bubble .reply-quote .who {
      color: var(--accent-dark);
      font-weight: 600;
      font-size: 12.5px;
      margin-bottom: 2px
    }

    body.dark .bubble .reply-quote .who {
      color: var(--accent)
    }

    .bubble .reply-quote .txt {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .msg-meta {
      float: right;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin: 7px 0 0 9px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1;
      white-space: nowrap
    }

    .msg-meta .tick {
      width: 17px;
      height: 11px;
      color: var(--muted)
    }

    .msg-meta .tick.read {
      color: var(--tick-read)
    }

    .msg-meta .edited {
      font-style: italic;
      font-size: 10.5px
    }

    .msg-meta .pin-ico {
      width: 12px;
      height: 12px;
      color: var(--muted)
    }

    .reactions {
      display: flex;
      gap: 3px;
      margin-top: -4px;
      margin-bottom: 3px;
      z-index: 1
    }

    .msg.in .reactions {
      justify-content: flex-start;
      padding-left: 8px
    }

    .msg.out .reactions {
      justify-content: flex-end;
      padding-right: 8px
    }

    .reactions .r {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1px 7px;
      font-size: 13px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer
    }

    .reactions .r .cnt {
      font-size: 11px;
      color: var(--muted)
    }

    .reactions .r.mine {
      background: rgba(0, 168, 132, .15);
      border-color: var(--accent)
    }

    .star-flag {
      position: absolute;
      top: 4px;
      right: 6px;
      color: var(--warn);
      font-size: 13px
    }

    .msg.out .star-flag {
      right: auto;
      left: 6px
    }

    /* Attachment preview inside composer */
    .attach-preview {
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0
    }

    .attach-preview img,
    .attach-preview video {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px
    }

    .attach-preview .doc-icon {
      width: 42px;
      height: 48px;
      background: var(--danger);
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 9px;
      font-weight: 700
    }

    .attach-preview .info {
      flex: 1;
      min-width: 0;
      font-size: 13.5px
    }

    .attach-preview .info .n {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .attach-preview .info .s {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px
    }

    /* Reply preview above composer */
    .reply-preview {
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-left: 4px solid var(--accent)
    }

    .reply-preview .info {
      flex: 1;
      min-width: 0
    }

    .reply-preview .info .who {
      font-size: 12.5px;
      color: var(--accent-dark);
      font-weight: 600;
      margin-bottom: 2px
    }

    body.dark .reply-preview .info .who {
      color: var(--accent)
    }

    .reply-preview .info .txt {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* Edit preview */
    .edit-preview {
      background: rgba(255, 176, 46, .12);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-left: 4px solid var(--warn);
      font-size: 13px
    }

    .edit-preview .info {
      flex: 1;
      min-width: 0
    }

    .edit-preview .info .who {
      font-size: 12.5px;
      color: var(--warn);
      font-weight: 600;
      margin-bottom: 2px
    }

    /* Smart replies */
    .smart-replies {
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      flex-shrink: 0
    }

    .smart-replies .sr {
      padding: 6px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      color: var(--accent-dark);
      transition: .15s;
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    body.dark .smart-replies .sr {
      color: var(--accent)
    }

    .smart-replies .sr:hover {
      background: rgba(0, 168, 132, .12);
      border-color: var(--accent)
    }

    .smart-replies .sr.ghost {
      color: var(--muted);
      border-style: dashed
    }

    /* Emoji / GIF / Sticker picker */
    .emoji-bar {
      display: none;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      flex-direction: column;
      max-height: 280px
    }

    .emoji-bar.open {
      display: flex
    }

    .emoji-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 8px
    }

    .emoji-tabs .et {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      user-select: none
    }

    .emoji-tabs .et.active {
      color: var(--accent-dark);
      border-bottom-color: var(--accent-dark);
      font-weight: 600
    }

    body.dark .emoji-tabs .et.active {
      color: var(--accent);
      border-bottom-color: var(--accent)
    }

    .emoji-grid {
      padding: 8px 12px;
      overflow-y: auto;
      display: grid;
      gap: 2px
    }

    .emoji-grid.emojis {
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr))
    }

    .emoji-grid.stickers {
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr))
    }

    .emoji-grid.gifs {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr))
    }

    .emoji-grid button {
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-size: 22px;
      height: 40px;
      line-height: 1
    }

    .emoji-grid.stickers button {
      font-size: 52px;
      height: 80px
    }

    .emoji-grid.gifs button {
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
      background-size: 300% 300%;
      animation: gifAnim 4s ease infinite;
      color: #fff;
      font-weight: 700;
      font-size: 13px
    }

    .emoji-grid.gifs button:nth-child(2n) {
      background: linear-gradient(120deg, #f6d365, #fda085, #84fab0, #8fd3f4);
      background-size: 300% 300%
    }

    .emoji-grid.gifs button:nth-child(3n) {
      background: linear-gradient(120deg, #a18cd1, #fbc2eb, #a6c1ee, #fbc2eb);
      background-size: 300% 300%
    }

    @keyframes gifAnim {

      0%,
      100% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }
    }

    .emoji-grid button:hover {
      background: rgba(134, 150, 160, .18)
    }

    .emoji-grid.gifs button:hover {
      filter: brightness(1.08)
    }

    /* Composer */
    .composer {
      flex-shrink: 0;
      background: var(--panel-2);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative
    }

    .composer input {
      flex: 1;
      height: 42px;
      border: none;
      outline: none;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text)
    }

    .composer input::placeholder {
      color: var(--muted)
    }

    .send-btn {
      color: var(--muted);
      transition: transform .12s
    }

    .send-btn.active {
      color: var(--accent-dark)
    }

    body.dark .send-btn.active {
      color: var(--accent)
    }

    .send-btn.active:active {
      transform: scale(.9)
    }

    /* Attach popover */
    .popover {
      position: absolute;
      bottom: 64px;
      left: 16px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .3);
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 30;
      min-width: 200px
    }

    .popover.open {
      display: flex;
      animation: pop .15s ease-out
    }

    .popover button {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      text-align: left
    }

    .popover button:hover {
      background: var(--hover)
    }

    .popover button svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0
    }

    .popover button:nth-child(1) svg {
      color: #7f66ff
    }

    .popover button:nth-child(2) svg {
      color: #007bfc
    }

    .popover button:nth-child(3) svg {
      color: #ffbc38
    }

    .popover button:nth-child(4) svg {
      color: #00a884
    }

    .popover button:nth-child(5) svg {
      color: #ea0038
    }

    .popover button:nth-child(6) svg {
      color: #f2a54c
    }

    /* Right info panel */
    .info-panel {
      width: 0;
      flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow: hidden;
      transition: width .25s;
      display: flex;
      flex-direction: column
    }

    .info-panel.open {
      width: 380px
    }

    .info-panel .panel-header {
      height: 59px;
      flex-shrink: 0;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px
    }

    .info-panel .panel-header .title {
      flex: 1;
      font-size: 16px;
      font-weight: 600
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      background: var(--panel-2);
      padding: 0 0 30px
    }

    .panel-hero {
      background: var(--panel);
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08)
    }

    .panel-hero .name {
      font-size: 22px;
      font-weight: 400
    }

    .panel-hero .sub {
      color: var(--muted);
      font-size: 14px
    }

    .panel-section {
      background: var(--panel);
      padding: 14px 20px;
      margin-top: 10px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06)
    }

    .panel-section .lbl {
      color: var(--accent-dark);
      font-size: 13px;
      margin-bottom: 6px
    }

    body.dark .panel-section .lbl {
      color: var(--accent)
    }

    .panel-section .val {
      font-size: 15px
    }

    .panel-section .desc {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5
    }

    .panel-action {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: var(--panel);
      cursor: pointer;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      transition: .15s
    }

    .panel-action:hover {
      background: var(--hover)
    }

    .panel-action.danger {
      color: var(--danger)
    }

    .panel-action svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0
    }

    .panel-action .grow {
      flex: 1
    }

    .panel-action .badge-toggle {
      width: 42px;
      height: 22px;
      border-radius: 11px;
      background: var(--muted);
      position: relative;
      transition: .2s;
      flex-shrink: 0
    }

    .panel-action .badge-toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: .2s
    }

    .panel-action .badge-toggle.on {
      background: var(--accent)
    }

    .panel-action .badge-toggle.on::after {
      left: 22px
    }

    /* ---------- MODALS ---------- */
    .modal-root {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 20, 26, .7);
      backdrop-filter: blur(2px)
    }

    .modal-root.open {
      display: flex;
      animation: fadeIn .15s
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal {
      background: var(--panel);
      border-radius: 14px;
      max-width: min(560px, 92vw);
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 14px 50px rgba(0, 0, 0, .4);
      animation: pop .18s ease-out
    }

    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px
    }

    .modal-head .title {
      flex: 1;
      font-size: 18px;
      font-weight: 600
    }

    .modal-head .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px
    }

    .modal-body {
      padding: 18px 24px;
      overflow-y: auto;
      flex: 1
    }

    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--panel)
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: .15s
    }

    .btn.primary {
      background: var(--accent);
      color: #fff
    }

    .btn.primary:hover {
      background: var(--accent-dark)
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted)
    }

    .btn.ghost:hover {
      background: var(--hover)
    }

    .btn.danger {
      background: var(--danger);
      color: #fff
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .field {
      display: block;
      margin-bottom: 14px
    }

    .field .lbl {
      display: block;
      font-size: 13px;
      color: var(--accent-dark);
      margin-bottom: 6px
    }

    body.dark .field .lbl {
      color: var(--accent)
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: .15s
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--accent)
    }

    .field textarea {
      resize: vertical;
      min-height: 70px
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer
    }

    .member-row:last-child {
      border: none
    }

    .member-row .grow {
      flex: 1;
      min-width: 0
    }

    .member-row .grow .n {
      font-size: 14.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .member-row .grow .s {
      font-size: 12.5px;
      color: var(--muted)
    }

    .member-row .cb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: .15s
    }

    .member-row.selected .cb {
      background: var(--accent);
      border-color: var(--accent)
    }

    .member-row.selected .cb::after {
      content: "✓";
      color: #fff;
      font-size: 12px;
      font-weight: 700
    }

    .member-row .tag {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600
    }

    /* Call screen */
    .call-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0b141a;
      color: #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 20px 40px
    }

    .call-screen.open {
      display: flex;
      animation: fadeIn .25s
    }

    .call-screen .who-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      font-size: 56px;
      background: var(--c, #666);
      display: grid;
      place-items: center;
      font-weight: 600;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, .08), 0 0 0 16px rgba(255, 255, 255, .04)
    }

    .call-screen .who-name {
      font-size: 28px;
      margin-top: 24px;
      font-weight: 400
    }

    .call-screen .who-status {
      color: #aaa;
      margin-top: 6px;
      font-size: 15px
    }

    .call-screen .video-self {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 120px;
      height: 160px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2a3942, #111b21);
      overflow: hidden;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .6)
    }

    .call-screen .video-self::after {
      content: "You";
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 11px;
      color: #ccc
    }

    .call-screen .controls {
      display: flex;
      gap: 20px;
      align-items: center
    }

    .call-screen .ctrl {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .15s
    }

    .call-screen .ctrl:hover {
      background: rgba(255, 255, 255, .25)
    }

    .call-screen .ctrl svg {
      width: 26px;
      height: 26px
    }

    .call-screen .ctrl.end {
      background: var(--danger)
    }

    .call-screen .ctrl.end:hover {
      background: #c00030
    }

    .call-screen .ctrl.off {
      background: #fff;
      color: #000
    }

    .call-screen .timer {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 20px
    }

    /* Context menu */
    .ctx-menu {
      position: fixed;
      z-index: 150;
      background: var(--panel);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      padding: 6px;
      min-width: 200px;
      display: none
    }

    .ctx-menu.open {
      display: block;
      animation: pop .12s ease-out
    }

    .ctx-menu button {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      text-align: left
    }

    .ctx-menu button:hover {
      background: var(--hover)
    }

    .ctx-menu button svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      color: var(--muted)
    }

    .ctx-menu .sep {
      height: 1px;
      background: var(--border);
      margin: 5px 4px
    }

    .ctx-menu .reactions-row {
      display: flex;
      gap: 2px;
      padding: 4px 4px;
      justify-content: space-around
    }

    .ctx-menu .reactions-row button {
      width: 38px;
      height: 38px;
      justify-content: center;
      font-size: 20px;
      padding: 0;
      border-radius: 50%
    }

    .ctx-menu .reactions-row button:hover {
      background: var(--hover);
      transform: scale(1.15)
    }

    /* Toasts */
    .toast-root {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 340px
    }

    .toast {
      background: var(--panel);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .35);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn .2s ease-out;
      pointer-events: auto;
      border-left: 4px solid var(--accent);
      font-size: 14px
    }

    .toast.call {
      border-left-color: #007bfc
    }

    .toast.warn {
      border-left-color: var(--warn)
    }

    .toast.err {
      border-left-color: var(--danger)
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(30px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .toast svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--accent)
    }

    .toast.call svg {
      color: #007bfc
    }

    .toast.warn svg {
      color: var(--warn)
    }

    .toast.err svg {
      color: var(--danger)
    }

    .toast .grow {
      flex: 1;
      min-width: 0
    }

    .toast .grow .t {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .toast .grow .s {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* AI pulse badge */
    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(90deg, #7f66ff, #00a884);
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: .3px
    }

    .ai-badge svg {
      width: 10px;
      height: 10px
    }

    /* Star panel */
    .sentiment-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px
    }

    .sentiment-bar .pos {
      background: #4caf50
    }

    .sentiment-bar .neu {
      background: #9e9e9e
    }

    .sentiment-bar .neg {
      background: #f44336
    }

    .sentiment-legend {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .sentiment-legend i {
      display: inline-block;
      width: 9px;
      height: 9px;

    const lastPick = {};
    function pick(arr, key) {
      if (arr.length === 1) return arr[0];
      let c, g = 0; do { c = arr[Math.floor(Math.random() * arr.length)]; g++; } while (c === lastPick[key] && g < 15);
      lastPick[key] = c; return c;
    }

    const REPLY_RULES = [

      { id: "money", test: /\b(money|paid|payment|bill|invoice|cost|price|expensive|cheap|rupees|dollars|budget)\b/i, replies: ["I'll transfer it today, promise 🙂", "Let me check the numbers and get back to you.", "Split it evenly? That's easiest.", "Ouch, that's a bit pricey 😅"] },

      { id: "congrats", test: /\b(congrats|congratulations|well\s*done|good\s*job|proud\s*of\s*you|selected|got\s*the\s*job|passed)\b/i, replies: ["Congratulations! 🎉 That's amazing!", "So happy for you! 🥳", "Well done, you earned it 👏"] },
      { id: "compliment", test: /\b(awesome|amazing|great|nice|brilliant|perfect|superb|fantastic|love\s*it|looks\s*good)\b/i, replies: ["Thanks! 😊 Appreciate it.", "Glad you liked it! 🙌", "That means a lot ❤️"] },
      { id: "positive", test: /\b(happy|excited|yay|woohoo|glad|good\s*news|great\s*news|finally)\b/i, replies: ["That's great to hear! 😄", "Yesss! 🎉 Tell me everything.", "So happy for you!", "Finally! About time 😁"] },
      { id: "negative", test: /\b(sad|tired|stressed|upset|angry|terrible|awful|sick|ill|depressed|annoyed|frustrated|exhausted)\b/i, replies: ["Oh no, what happened? 🥺", "That sucks. Want to talk about it?", "Take it easy, okay? Rest up.", "I'm here if you need anything ❤️"] },
      { id: "work", test: /\b(work|office|job|project|deadline|boss|client|study|exam|college|school|class|assignment|interview)\b/i, replies: ["Sounds hectic 😅 How's it going?", "Deadlines everywhere, I feel you.", "Good luck! You've got this 💪", "Let me know if you need a hand."] },
      { id: "agree", test: /^(yes|yeah|yep|ya|yup|ok|okay|okey|k|sure|fine|alright|correct|right|haan|ha|done|noted)\b/i, replies: ["Cool 👍", "Perfect!", "Great, let's do it.", "Awesome, see you then 🙂"] },
      { id: "disagree", test: /^(no|nope|nah|never|not\s*really|nahi|nahin)\b/i, replies: ["Oh okay, no problem.", "Alright, maybe next time 🙂", "Fair enough.", "Hmm, why not?"] },
      { id: "q-time", test: /\b(when|what\s*time|which\s*day|how\s*long|kab)\b/i, replies: ["Let me check and confirm the time ⏰", "I think around 6pm — I'll confirm.", "Give me 5 min, I'll check my calendar.", "Does tomorrow evening work?"] },
      { id: "q-where", test: /\b(where|which\s*place|kahan)\b/i, replies: ["Near the main square — I'll drop a pin 📍", "Same place as last time?", "I'll send the location in a sec.", "Not sure yet, let me find out."] },
      { id: "q-who", test: /\b(who|whose|kisne|kaun)\b/i, replies: ["Not sure yet, let me ask around.", "I think it was Ravi. Let me confirm.", "No idea honestly 😅"] },
      { id: "q-why", test: /\b(why|how\s*come|kyun)\b/i, replies: ["Honestly? No idea 😅", "Let's figure it out together.", "I was wondering the same thing.", "Long story — I'll tell you later 😄"] },
      { id: "q-how", test: /\b(how\s*(do|can|to|should)|how\s*do\s*i)\b/i, replies: ["Pretty simple — I'll walk you through it.", "Just follow the same steps as last time 👍", "Let me send you a quick guide."] }
    ];
    const FALLBACK_SHORT = ["Got it 👍", "Makes sense.", "Oh nice!", "Hmm, tell me more.", "Okay, noted 👌", "Interesting!", "I see what you mean."];
    const FALLBACK_LONG = ["That's a lot to take in 😅 Give me a sec.", "Okay, I read all of it. Let me think.", "Got it — that makes sense now.", "Hmm, I need to process that 😄"];

    function generateReply(raw) {
      const text = String(raw).trim();
      const lower = text.toLowerCase();
      for (const r of REPLY_RULES) if (r.test.test(lower)) return pick(r.replies, r.id);
      if (/\?\s*$/.test(text)) return pick([
        "Good question 🤔 Let me think about it.", "Hmm, I'm not 100% sure — I'll check.",
        "Let me get back to you on that one.", "Honestly, no idea 😅 What do you think?"], "gq");
      if (text.length > 70) return pick(FALLBACK_LONG, "long");
      if (text.length <= 4) return pick(["Got it 👍", "Okay!", "Hmm 🙂", "Cool cool."], "tiny");
      if (Math.random() < 0.2) {
        const q = text.length > 30 ? text.slice(0, 28).trim() + "…" : text;
        return `"${q}" — yeah, I get what you mean.`;
      }
      return pick(FALLBACK_SHORT, "short");
    }

    /* Smart reply suggestions */
    function smartReplies(text) {
      const t = text.toLowerCase();
      if (/\?/.test(t)) return ["Yes, sure 👍", "Let me check", "Not sure yet"];
      if (/(meet|tomorrow|tonight|plan|call)/.test(t)) return ["Works for me", "What time?", "Can't make it"];
      if (/(thanks|thank you)/.test(t)) return ["Anytime 😊", "No worries", "👍"];
      if (/(congrats|great news|selected)/.test(t)) return ["Congrats! 🎉", "So happy for you", "Amazing!"];
      if (/(food|lunch|dinner|coffee)/.test(t)) return ["I'm in 🍕", "Can't today", "Sounds good"];
      if (/(sad|tired|stressed|upset)/.test(t)) return ["Take care ❤️", "What happened?", "Here for you"];
      if (/(hi|hey|hello)/.test(t)) return ["Hey! 👋", "Hi there", "Hello 😄"];
      return ["Got it 👍", "Okay", "Tell me more"];
    }

    /* Sentiment analysis */
    function analyzeSentiment(messages) {
      const pos = /(good|great|awesome|happy|love|nice|thanks|amazing|perfect|yay|❤️|😍|🎉|👍)/i;
      const neg = /(bad|sad|angry|hate|awful|terrible|sorry|upset|stress|😩|😭|😡|👎)/i;
      let p = 0, n = 0;
      messages.forEach(m => { if (pos.test(m.text)) p++; if (neg.test(m.text)) n++; });
      const total = messages.length || 1;
      const pp = Math.round(p / total * 100), nn = Math.round(n / total * 100);
      const neu = Math.max(0, 100 - pp - nn);
      let label = "Neutral"; if (pp > nn + 15) label = "Positive"; else if (nn > pp + 15) label = "Negative";
      return { pp, nn, neu, label, total };
    }

    /* Spam detection */
    function isSpam(text) {
      const caps = (text.match(/[A-Z]/g) || []).length;
      const letters = (text.match(/[A-Za-z]/g) || []).length;
      if (letters > 12 && caps / letters > 0.75) return true;
      if (/(https?:\/\/|www\.)/i.test(text) && /(win|prize|free|click|claim|urgent)/i.test(text)) return true;
      if (/(.)\1{6,}/.test(text)) return true;
      return false;
    }

    /* Tiny translation dictionary (EN→ES demo) */
    const TRANS = {
      hello: "hola", hi: "hola", hey: "oye", thanks: "gracias", "thank you": "gracias",
      yes: "sí", no: "no", good: "bueno", bad: "malo", "good morning": "buenos días",
      "good night": "buenas noches", please: "por favor", sorry: "lo siento", love: "amor",
      friend: "amigo", water: "agua", food: "comida", happy: "feliz", sad: "triste",
      "how are you": "cómo estás", "see you": "hasta luego", bye: "adiós", welcome: "bienvenido",
      "i love you": "te quiero", "what's up": "qué tal", great: "genial", cool: "genial",
      today: "hoy", tomorrow: "mañana", "thank you so much": "muchas gracias"
    };
    function fakeTranslate(text, to = "Spanish") {
      let out = text;
      Object.keys(TRANS).sort((a, b) => b.length - a.length).forEach(k => {
        out = out.replace(new RegExp("\\b" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi"),
          m => TRANS[k]);
      });
      return { text: out, lang: to };
    }

    /* Extractive summarizer */
    function summarize(messages) {
      if (!messages.length) return "Nothing to summarize.";
      const stop = new Set("the a an and or but if is are was were be been being to of in on at for with from by as it its this that these those i you he she we they me him her us them my your his her our their".split(" "));
      const freq = {};
      messages.forEach(m => {
        (m.text.toLowerCase().match(/\b[a-z]{3,}\b/g) || []).forEach(w => { if (!stop.has(w)) freq[w] = (freq[w] || 0) + 1; });
      });
      const scored = messages.map(m => {
        const words = m.text.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
        let s = 0; words.forEach(w => { if (!stop.has(w)) s += freq[w] || 0; });
        return { m, s: s / Math.max(1, words.length) };
      }).sort((a, b) => b.s - a.s);
      const top = scored.slice(0, Math.min(3, scored.length)).sort((a, b) => a.m.id - b.m.id);
      return top.map(t => `• ${t.m.text}`).join("\n");
    }

    /* =========================================================
       RENDER: CHAT LIST
       ========================================================= */
    function renderChatList() {
      const q = state.query.trim().toLowerCase();
      const f = state.filter;
      const list = state.chats.filter(c => {
        if (f === "archived" && !c.archived) return false;
        if (f !== "archived" && c.archived) return false;
        if (f === "unread" && !c.unread) return false;
        if (f === "pinned" && !c.pinned) return false;
        if (!q) return true;
        const last = lastMsg(c);
        return c.name.toLowerCase().includes(q) || (last && last.text.toLowerCase().includes(q));
      }).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      if (!list.length) {
        chatListEl.innerHTML = `<div class="list-empty">No chats here</div>`;
        return;
      }

      chatListEl.innerHTML = list.map(c => {
        const last = lastMsg(c);
        let previewHTML;
        if (c.typing) previewHTML = `<span class="preview typing">typing…</span>`;
        else if (last) {
          let prefix = "";
          if (last.out) prefix = `<span class="you">You: </span>`;
          else if (c.type === "group" && last.from) prefix = `<span class="you">${esc(last.from)}: </span>`;
          const txt = last.text || (last.type === "image" ? "📷 Photo" : last.type === "video" ? "🎥 Video" : last.type === "doc" ? "📄 Document" : last.type === "voice" ? "🎤 Voice message" : last.type === "location" ? "📍 Location" : last.type === "contact" ? "👤 Contact" : last.type === "poll" ? "📊 Poll" : "");
          previewHTML = `<span class="preview">${prefix}${esc(txt)}</span>`;

            ${previewHTML}
            ${c.unread ? `<span class="badge ${c.muted ? "muted" : ""}">${c.unread}</span>` : ""}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button></div>`;
      if (m.type === "location") return `<div class="loc">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/></svg>
    <div class="loc-txt">📍 ${esc(m.media.label || "Shared location")}</div></div>`;
      if (m.type === "contact") return `<div class="contact">
    <div class="avatar" style="--c:#00a884">${esc(initials(m.media.name))}</div>
    <div class="info"><div class="n">${esc(m.media.name)}</div><div class="p">${esc(m.media.phone)}</div></div></div>`;
      if (m.type === "poll") {
        const totalVotes = m.media.options.reduce((a, o) => a + (o.votes || 0), 0) || 1;
        return `<div class="poll"><div class="q">${esc(m.media.question)}</div>
      ${m.media.options.map((o, i) => `
        <div class="opt ${m.media.myVote === i ? "voted" : ""}" data-poll="${m.id}" data-opt="${i}">
          <div class="bar"><div class="fill" style="width:${Math.round((o.votes || 0) / totalVotes * 100)}%"></div>
            <div class="lbl">${m.media.myVote === i ? "● " : ""}${esc(o.text)}</div></div>
          <div class="pct">${Math.round((o.votes || 0) / totalVotes * 100)}%</div>
        </div>`).join("")}
      <div class="meta">${totalVotes} vote${totalVotes === 1 ? "" : "s"}</div></div>`;
      }
      if (m.type === "voice") {
        const bars = Array.from({ length: 24 }, (_, i) => `<i style="height:${6 + Math.abs(Math.sin(i * 1.7)) * 16}px"></i>`).join("");
        return `<div class="voice" data-voice="${m.id}">
      <div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="wave">${bars}</div>

      return "";

    function bubbleHTML(m, groupStart, chat, chatQuery) {
      const sender = (!m.out && chat.type === "group" && m.from) ? `<div style="font-size:12.5px;color:var(--accent-dark);font-weight:600;margin-bottom:3px">${esc(m.from)}</div>` : "";
      let inner = "";
      if (m.type && m.type !== "text") {
        inner = mediaHTML(m);
        if (m.text) inner += `<div class="caption">${esc(m.text)}</div>`;
      } else {
        let txt = esc(m.text);
        if (chatQuery) txt = txt.replace(new RegExp(chatQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m2 => `<mark style="background:#ffe082;color:#000">${m2}</mark>`);
        if (chat.type === "group") txt = txt.replace(/@(\w+)/g, `<b style="color:var(--accent-dark)">@$1</b>`);
        inner = txt;
      }

      const reply = m.replyTo ? (() => {
        const rm = findMsg(chat, m.replyTo);
        if (!rm) return "";
        const who = rm.out ? "You" : (rm.from || chat.name);
        return `<div class="reply-quote" data-jump="${rm.id}"><div class="who">${esc(who)}</div><div class="txt">${esc(rm.text || "[media]")}</div></div>`;
      })() : "";

      const star = m.starred ? `<div class="star-flag">★</div>` : "";
      const pin = m.pinned ? `<span class="pin-ico" title="Pinned"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 4v5l3 3v2h-5v6l-1 2-1-2v-6H5v-2l3-3V4z"/></svg></span>` : "";

      const reactions = (m.reactions && Object.keys(m.reactions).length)
        ? `<div class="reactions">${Object.entries(m.reactions).map(([em, users]) =>
          `<div class="r ${users.includes("You") ? "mine" : ""}" data-react="${m.id}" data-em="${em}">${em}<span class="cnt">${users.length}</span></div>`).join("")}</div>`
        : "";

      const spam = isSpam(m.text || "") ? `<div style="color:var(--warn);font-size:11.5px;margin-top:4px">⚠️ Possibly spam</div>` : "";

      const meta = `<span class="msg-meta">${m.edited ? '<span class="edited">edited</span> ' : ""}${pin}${m.time}${m.out ? tickHTML(m.status || "sent") : ""}</span>`;

      const bubbleClass = (m.type && m.type !== "text" && m.type !== "poll") ? "bubble media" : "bubble";
      return `
    <div class="msg ${m.out ? "out" : "in"} ${groupStart ? "group-start" : ""} ${m._selected ? "selected" : ""}" data-mid="${m.id}">
      <div class="${bubbleClass}">
        ${sender}
        ${reply}
        ${star}
        ${inner}
        ${spam}
        ${meta}
      </div>
    </div>
    ${reactions}`;
    }

    function renderMessages(scroll = true) {
      const chat = getActive(); if (!chat) return;

      chat.messages.forEach((m, i) => {
        const prev = chat.messages[i - 1];
        const groupStart = !prev || prev.out !== m.out || (prev.from || "") !== (m.from || "");
        html += bubbleHTML(m, groupStart, chat, state.chatQuery);
      });
      if (state.typingIn === chat.id) {
        html += `<div class="msg in group-start"><div class="bubble typing-bubble"><i></i><i></i><i></i></div></div>`;
      }
      messagesEl.innerHTML = html;
      if (scroll) requestAnimationFrame(() => messagesEl.scrollTop = messagesEl.scrollHeight);
    }

    <div class="panel-action" id="encryptInfo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>

      <span class="grow">${isGroup ? "Exit group" : "Block contact"}</span></div>

      $("blockBtn").onclick = () => {

    /* =========================================================
       MESSAGE RENDER ACTIONS (context menu etc.)
       ========================================================= */
    function showCtxMenu(e, msgId) {
      const chat = getActive(); if (!chat) return;
      const m = findMsg(chat, msgId); if (!m) return;
      state.ctxMsg = msgId;

      const reactionRow = `<div class="reactions-row">
    ${["👍", "❤️", "😂", "😮", "😢", "🙏"].map(em => `<button data-ctx="react" data-em="${em}">${em}</button>`).join("")}
  </div><div class="sep"></div>`;

      const canEdit = m.out && m.type !== "text" ? false : m.out;
      const items = [
        `<button data-ctx="reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Reply</button>`,
        `<button data-ctx="forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v5"/></svg>Forward</button>`,
        `<button data-ctx="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>`,
        m.type === "text" ? `<button data-ctx="translate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h12M10 3v2c0 5-2 8-6 10"/><path d="M6 15c3-1 5-4 6-8"/><path d="m13 21 4-11 4 11M14.5 17h5"/></svg>Translate <span class="ai-badge" style="margin-left:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 14 9l6 1-4.5 4.5L17 21l-5-3-5 3 1.5-6.5L4 10l6-1z"/></svg>AI</span></button>` : "",
        m.type === "text" && canEdit ? `<button data-ctx="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7 21H3v-4z"/></svg>Edit</button>` : "",
        `<button data-ctx="pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 4v5l3 3v2h-5v6l-1 2-1-2v-6H5v-2l3-3V4z"/></svg>${m.pinned ? "Unpin" : "Pin"}</button>`,
        `<button data-ctx="star"><svg viewBox="0 0 24 24" fill="${m.starred ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.6 6.6L21 10l-5 4.5L17.5 21 12 17.5 6.5 21 8 14.5 3 10l6.4-.4z"/></svg>${m.starred ? "Unstar" : "Star"}</button>`,
        `<div class="sep"></div>`,
        `<button data-ctx="delete" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Delete</button>`
      ].join("");

      ctxMenu.innerHTML = reactionRow + items;
      const x = Math.min(e.clientX, window.innerWidth - 230);
      const y = Math.min(e.clientY, window.innerHeight - 420);
      ctxMenu.style.left = x + "px";
      ctxMenu.style.top = Math.max(10, y) + "px";
      ctxMenu.classList.add("open");

      ctxMenu.querySelectorAll("button[data-ctx]").forEach(b => {
        b.onclick = () => { handleCtx(b.dataset.ctx, b.dataset.em); };
      });
    }
    function hideCtx() { ctxMenu.classList.remove("open"); state.ctxMsg = null; }

    function handleCtx(action, em) {
      const chat = getActive(); if (!chat) return;
      const m = findMsg(chat, state.ctxMsg); if (!m) { hideCtx(); return; }
      hideCtx();

      if (action === "react") {
        m.reactions = m.reactions || {};
        const users = m.reactions[em] || [];
        const i = users.indexOf("You");
        if (i >= 0) { users.splice(i, 1); if (!users.length) delete m.reactions[em]; }
        else users.push("You");
        if (users.length) m.reactions[em] = users;
        renderMessages(false); return;
      }
      if (action === "reply") {
        state.replyTo = m.id; state.editing = null;
        showReplyPreview(); inputEl.focus(); return;
      }
      if (action === "forward") { openForwardModal(m); return; }
      if (action === "copy") {
        const txt = m.text || "[media message]";
        navigator.clipboard?.writeText(txt);
        toast("msg", "Copied", txt.slice(0, 60)); return;
      }
      if (action === "translate") {
        const t = fakeTranslate(m.text);
        toast("msg", "Translated → Spanish", t.text, 5000); return;
      }
      if (action === "edit") {
        state.editing = m.id; state.replyTo = null;
        inputEl.value = m.text; showEditPreview(); inputEl.focus(); return;
      }
      if (action === "pin") { m.pinned = !m.pinned; toast("msg", m.pinned ? "Pinned" : "Unpinned", m.text?.slice(0, 40)); renderMessages(false); return; }
      if (action === "star") { m.starred = !m.starred; toast("msg", m.starred ? "Starred" : "Unstarred", m.text?.slice(0, 40)); renderMessages(false); return; }
      if (action === "delete") {
        if (confirm(m.out ? "Delete for everyone?" : "Delete message?")) {
          m.deleted = true;
          if (m.out) { chat.messages = chat.messages.filter(x => x.id !== m.id); }
          else { m.text = "This message was deleted"; m.type = "text"; }
          renderMessages(false); renderChatList();
        }
      }
    }

    /* Reply/Edit previews */
    function showReplyPreview() {
      const chat = getActive(); const m = findMsg(chat, state.replyTo);
      if (!m) return hideReplyPreview();
      const who = m.out ? "You" : (m.from || chat.name);
      $("replyPreview").classList.remove("hidden");
      $("replyPreview").innerHTML = `
    <div class="info"><div class="who">Replying to ${esc(who)}</div><div class="txt">${esc(m.text || "[media]")}</div></div>
    <button class="icon-btn sm" id="cancelReply">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`;
      $("cancelReply").onclick = hideReplyPreview;
    }
    function hideReplyPreview() { state.replyTo = null; $("replyPreview").classList.add("hidden"); }

    function showEditPreview() {
      const chat = getActive(); const m = findMsg(chat, state.editing);
      if (!m) return hideEditPreview();
      $("editPreview").classList.remove("hidden");
      $("editPreview").innerHTML = `
    <div class="info"><div class="who">Editing message</div><div class="txt">${esc(m.text)}</div></div>
    <button class="icon-btn sm" id="cancelEdit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`;
      $("cancelEdit").onclick = () => { hideEditPreview(); inputEl.value = ""; updateSendState(); };
    }
    function hideEditPreview() { state.editing = null; $("editPreview").classList.add("hidden"); }

    /* =========================================================
       SEND / SIMULATE
       ========================================================= */
    function sendMessage() {
      const chat = getActive(); if (!chat) return;

      // Editing mode
      if (state.editing) {
        const m = findMsg(chat, state.editing);
        if (m && inputEl.value.trim()) {
          m.text = inputEl.value.trim(); m.edited = true;
        }
        hideEditPreview(); inputEl.value = ""; updateSendState(); renderMessages(); renderChatList(); return;
      }

      const text = inputEl.value.trim();
      const att = state.attachment;
      if (!text && !att) return;

      const msg = {
        id: uid(), time: nowTime(), out: true, status: "sent",
        text: text || "", type: att ? att.type : "text", replyTo: state.replyTo
      };

      if (att) {
        if (att.type === "image" || att.type === "video") msg.media = att.data;
        if (att.type === "doc") msg.media = att.file;
        if (att.type === "voice") msg.media = { duration: att.duration };
        if (att.type === "location") msg.media = { label: att.label };
        if (att.type === "contact") msg.media = { name: att.name, phone: att.phone };
        if (att.type === "poll") msg.media = { question: att.question, options: att.options.map(o => ({ text: o, votes: 0 })), myVote: null };
      }

      chat.messages.push(msg);
      inputEl.value = "";
      hideReplyPreview();
      clearAttachment();
      updateSendState();
      renderMessages();
      renderChatList();

      // receipts
      setTimeout(() => { if (msg.status === "sent") { msg.status = "delivered"; if (state.activeId === chat.id) renderMessages(false); } }, 700);

      // attachment counters / replies
      if (att && att.type !== "poll" && att.type !== "voice") simulateReply(chat.id, att.type + " received!");
      else if (att && att.type === "voice") simulateReply(chat.id, "voice message received");
      else simulateReply(chat.id, text);
    }

    function simulateReply(chatId, userText) {
      replyTimers.forEach(clearTimeout); replyTimers = [];
      const chat = state.chats.find(c => c.id === chatId); if (!chat) return;

      const replyText = generateReply(userText);
      const thinkDelay = 450 + Math.random() * 600;
      const typeDuration = Math.min(2600, Math.max(700, replyText.length * 45));

      replyTimers.push(setTimeout(() => {
        state.typingIn = chatId;
        chat.typing = true;
        if (state.activeId === chatId) { renderHeader(); renderMessages(); }
        renderChatList();
      }, thinkDelay));

      replyTimers.push(setTimeout(() => {
        state.typingIn = null; chat.typing = false;
        chat.messages.forEach(m => { if (m.out) m.status = "read"; });
        chat.messages.push({ id: uid(), text: replyText, time: nowTime(), out: false, from: chat.type === "group" ? "Ravi" : undefined });

        if (state.activeId === chatId) {
          renderHeader(); renderMessages();
          showSmartReplies(replyText);
        } else {
          chat.unread = (chat.unread || 0) + 1;
          if (!chat.muted) toast("msg", chat.name, replyText);
        }
        renderChatList();
      }, thinkDelay + typeDuration));
    }

    function showSmartReplies(lastText) {
      const sr = smartReplies(lastText);
      const wrap = $("smartReplies");
      wrap.classList.remove("hidden");
      wrap.innerHTML = sr.map(t => `<div class="sr" data-sr="${esc(t)}">${esc(t)}</div>`).join("")
        + `<div class="sr ghost" data-sr="">Dismiss</div>`;
      wrap.querySelectorAll("[data-sr]").forEach(el => {
        el.onclick = () => { const v = el.dataset.sr; wrap.classList.add("hidden"); if (v) { inputEl.value = v; sendMessage(); } };
      });
      setTimeout(() => wrap.classList.add("hidden"), 12000);
    }

    function updateSendState() {
      const hasText = inputEl.value.trim().length > 0;
      const hasAtt = !!state.attachment;
      sendBtn.classList.toggle("active", hasText || hasAtt);
      sendBtn.querySelector("svg").innerHTML = (hasText || hasAtt)
        ? `<path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>`
        : `<rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    }

    /* =========================================================
       ATTACHMENTS
       ========================================================= */
    function clearAttachment() { state.attachment = null; $("attachPreview").classList.add("hidden"); $("attachPreview").innerHTML = ""; }

    function setAttachment(a) {
      state.attachment = a;
      const wrap = $("attachPreview"); wrap.classList.remove("hidden");
      let preview = "";
      if (a.type === "image") preview = `<img src="${a.data}"/><div class="info"><div class="n">Photo</div><div class="s">Ready to send</div></div>`;
      if (a.type === "video") preview = `<video src="${a.data}"></video><div class="info"><div class="n">Video</div><div class="s">Ready to send</div></div>`;
      if (a.type === "doc") preview = `<div class="doc-icon">PDF</div><div class="info"><div class="n">${esc(a.file.name)}</div><div class="s">${esc(a.file.size)}</div></div>`;
      if (a.type === "location") preview = `<div style="width:56px;height:56px;background:#c8e6c9;border-radius:6px;display:grid;place-items:center;font-size:24px">📍</div><div class="info"><div class="n">Location</div><div class="s">${esc(a.label)}</div></div>`;
      if (a.type === "contact") preview = `<div class="avatar" style="--c:#00a884">${esc(initials(a.name))}</div><div class="info"><div class="n">${esc(a.name)}</div><div class="s">${esc(a.phone)}</div></div>`;
      if (a.type === "voice") preview = `<div style="width:56px;height:56px;background:var(--accent);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px">🎤</div><div class="info"><div class="n">Voice message</div><div class="s">${a.duration}</div></div>`;
      if (a.type === "poll") preview = `<div style="width:56px;height:56px;background:#ffbc38;border-radius:6px;display:grid;place-items:center;font-size:24px">📊</div><div class="info"><div class="n">${esc(a.question)}</div><div class="s">${a.options.length} options</div></div>`;

      wrap.innerHTML = preview + `<button class="icon-btn" id="attachCancel" style="margin-left:auto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
      $("attachCancel").onclick = clearAttachment;
      updateSendState();
    }

    /* File handlers */
    $("filePhoto").addEventListener("change", (e) => {
      const files = [...e.target.files]; if (!files.length) return;
      const f = files[0];
      const reader = new FileReader();
      reader.onload = () => setAttachment({ type: f.type.startsWith("video") ? "video" : "image", data: reader.result });
      reader.readAsDataURL(f);
      e.target.value = "";
    });
    $("fileCam").addEventListener("change", (e) => {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => setAttachment({ type: "image", data: reader.result });
      reader.readAsDataURL(f);
      e.target.value = "";
    });
    $("fileDoc").addEventListener("change", (e) => {
      const f = e.target.files[0]; if (!f) return;
      setAttachment({ type: "doc", file: { name: f.name, size: (f.size / 1024).toFixed(1) + " KB" } });
      e.target.value = "";
    });

    /* =========================================================
       POLLS
       ========================================================= */
    function openPollModal() {
      openModal({
        title: "Create poll", body: `
      <label class="field"><span class="lbl">Question</span>
        <input id="pollQ" placeholder="Ask a question" maxlength="100"/></label>
      <label class="field"><span class="lbl">Option 1</span><input id="pollO1" maxlength="60"/></label>
      <label class="field"><span class="lbl">Option 2</span><input id="pollO2" maxlength="60"/></label>
      <label class="field"><span class="lbl">Option 3 (optional)</span><input id="pollO3" maxlength="60"/></label>
    `,
        actions: `
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" id="pollSend">Send</button>`
      });
      $("pollSend").onclick = () => {
        const q = $("pollQ").value.trim();
        const opts = ["pollO1", "pollO2", "pollO3"].map(id => $(id).value.trim()).filter(Boolean);
        if (!q || opts.length < 2) return toast("err", "Poll needs question + 2 options");
        closeModal();
        setAttachment({ type: "poll", question: q, options: opts });
      };

    /* =========================================================
       CALLS
       ========================================================= */
    function startCall(chatId, video) {
      const chat = state.chats.find(c => c.id === chatId) || state.calls.find(c => c.id === chatId);
      if (!chat) return;
      const name = chat.name, color = chat.color;
      $("callAvatar").style.setProperty("--c", color);
      $("callAvatar").textContent = initials(name);
      $("callName").textContent = name;
      $("callStatus").textContent = "Calling…";
      $("callTimer").textContent = "";
      $("callScreen").classList.add("open");
      state.call = { chatId, video, start: null, muted: false, cam: false, speaker: true };

      setTimeout(() => {
        if (!state.call) return;
        $("callStatus").textContent = "Ringing…";
      }, 1200);

      setTimeout(() => {
        if (!state.call) return;
        state.call.start = Date.now();
        $("callStatus").textContent = "Connected";
        state.call.tick = setInterval(() => {
          if (!state.call || !state.call.start) return;
          const s = Math.floor((Date.now() - state.call.start) / 1000);
          const mm = String(Math.floor(s / 60)).padStart(2, "0");
          const ss = String(s % 60).padStart(2, "0");
          $("callTimer").textContent = mm + ":" + ss;
        }, 1000);
      }, 3200);

      toast("call", video ? "Video call" : "Voice call", "Connecting to " + name);
    }
    function endCall() {
      if (state.call) { clearInterval(state.call.tick); }
      state.call = null;
      $("callScreen").classList.remove("open");
      $("callTimer").textContent = "";
    }

       STATUS

    function viewStatus(id) {
